<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rejsudai">
  <defs>
    <linearGradient id="rj-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7189ff"/>
      <stop offset=".5" stop-color="#4c6ef5"/>
      <stop offset="1" stop-color="#5730c6"/>
    </linearGradient>
    <linearGradient id="rj-wing" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff2ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#rj-tile)"/>

  <!-- flight path: where the plane has been -->
  <path d="M8.5 55.5C13.5 50.5 18 47.5 24 45" fill="none" stroke="#ffffff" stroke-opacity=".5"
        stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 6.4"/>

  <!-- AI sparkles: the "intelligence" half of the mark -->
  <g fill="#ffffff">
    <path d="M16.5 9.5Q16.5 17 24 17Q16.5 17 16.5 24.5Q16.5 17 9 17Q16.5 17 16.5 9.5Z" opacity=".93"/>
    <path d="M27.6 6.1Q27.6 9.7 31.2 9.7Q27.6 9.7 27.6 13.3Q27.6 9.7 24 9.7Q27.6 9.7 27.6 6.1Z" opacity=".62"/>
  </g>

  <!-- paper plane: the "travel" half -->
  <path d="M50 14 14 31l17 6z" fill="url(#rj-wing)"/>
  <path d="M50 14 31 37l3 14z" fill="#c8d3fc"/>
</svg>
